<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrandFoundry — Watch it in action</title>
    <meta
      name="description"
      content="AI-powered brand identity studio. Watch BrandFoundry generate logos, palettes, and taglines from a single prompt."
    />
    <link rel="icon" href="assets/logo-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero__aurora" aria-hidden="true"></div>
      <div class="hero__inner">
        <div class="hero__mark">
          <img src="assets/logo-icon.png" alt="" class="hero__logo" />
          <span class="hero__wordmark">BrandFoundry</span>
        </div>
        <h1 class="hero__title">Watch the platform in action.</h1>
        <p class="hero__tagline">
          AI-powered brand identity studio that lets users describe their business in plain English
          and generates cohesive brand assets — logos, color palettes, and taglines — all in one
          place.
        </p>
      </div>
    </header>

    <main class="page">
      <section class="videos" id="video-list" aria-label="Demo videos">
        <!-- rendered by main.js -->
      </section>
    </main>

    <footer class="footer">
      <div class="footer__inner">
        <div class="footer__left">
          <img src="assets/logo-icon.png" alt="" class="footer__logo" />
          <div>
            <div class="footer__title">BrandFoundry</div>
            <div class="footer__sub">NC State CSC Senior Design — Team 07</div>
          </div>
        </div>
        <div class="footer__qr" id="qr-block">
          <!-- populated by main.js if assets/qr-code.png exists -->
        </div>
      </div>
    </footer>

    <script src="main.js" defer></script>
  </body>
</html>
